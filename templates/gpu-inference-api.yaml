      TargetType: ip
      UnhealthyThresholdCount: 5
      VpcId:
        Ref: VpcId
    Metadata:
      aws:cdk:path: GpuInferenceApi/Inference/AlbTargets/Resource
  InferenceServiceCF6639DD:
