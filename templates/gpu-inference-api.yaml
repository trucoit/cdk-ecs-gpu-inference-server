            - GroupId
      Subnets:
        - Ref: PrivateSubnetId1
        - Ref: PrivateSubnetId2
      Type: application
    Metadata:
      aws:cdk:path: GpuInferenceApi/Inference/Alb/Resource
  InferenceAlbSecurityGroup43AB8D63:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Automatically created Security Group for ELB GpuInferenceApiInferenceAlb6D258621
      SecurityGroupIngress:
        - CidrIp: 0.0.0.0/0
          Description: Allow from anyone on port 80
          FromPort: 80
          IpProtocol: tcp
          ToPort: 80
      VpcId:
        Ref: VpcId
    Metadata:
      aws:cdk:path: GpuInferenceApi/Inference/Alb/SecurityGroup/Resource
  InferenceAlbSecurityGrouptoGpuInferenceApiInferenceTaskSecurityGroupA527F23D80008213D91F:
