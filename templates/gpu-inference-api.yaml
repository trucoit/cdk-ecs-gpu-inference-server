Description: "GPU inference (API mode): vLLM behind an internal ALB on ECS Managed Instances."
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to deploy into.
  PrivateSubnetId1:
    Type: AWS::EC2::Subnet::Id
    Description: First private subnet (needs egress to pull images and reach AWS APIs).
  PrivateSubnetId2:
    Type: AWS::EC2::Subnet::Id
    Description: Second private subnet (different AZ).
  ModelId:
    Type: String
    Default: Qwen/Qwen2.5-1.5B-Instruct
    Description: Model the vLLM server loads.
  ModelImage:
    Type: String
    Default: vllm/vllm-openai:v0.6.6
    Description: OpenAI-compatible model server image.
Resources:
  InferenceTaskSecurityGroup3C4FE9ED:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: GPU inference task ENIs
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: HTTPS egress to AWS endpoints and image registries
          FromPort: 443
          IpProtocol: tcp
          ToPort: 443
      VpcId:
        Ref: VpcId
    Metadata:
      aws:cdk:path: GpuInferenceApi/Inference/TaskSecurityGroup/Resource
  InferenceTaskSecurityGroupfromGpuInferenceApiInferenceAlbSecurityGroup073F79C980005569A6EC:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: ALB to model container
      FromPort: 8000
      GroupId:
        Fn::GetAtt:
          - InferenceTaskSecurityGroup3C4FE9ED
          - GroupId
      IpProtocol: tcp
      SourceSecurityGroupId:
        Fn::GetAtt:
          - InferenceAlbSecurityGroup43AB8D63
          - GroupId
      ToPort: 8000
    Metadata:
      aws:cdk:path: GpuInferenceApi/Inference/TaskSecurityGroup/from GpuInferenceApiInferenceAlbSecurityGroup073F79C9:8000
  InferenceCluster6D181EAC:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings:
        - Name: containerInsights
          Value: enhanced
    Metadata:
      aws:cdk:path: GpuInferenceApi/Inference/Cluster/Resource
  InferenceInstanceSecurityGroup1503225E:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: GPU inference instances
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: HTTPS egress to AWS endpoints and image registries
          FromPort: 443
          IpProtocol: tcp
          ToPort: 443
      VpcId:
        Ref: VpcId
    Metadata:
      aws:cdk:path: GpuInferenceApi/Inference/InstanceSecurityGroup/Resource
  InferenceGpuCapacityGpuCapacityRole926629D2:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: ecs.amazonaws.com
        Version: "2012-10-17"
      ManagedPolicyArns:
        - Fn::Join:
            - ""
            - - "arn:"
              - Ref: AWS::Partition
              - :iam::aws:policy/AmazonECSInfrastructureRolePolicyForManagedInstances
    Metadata:
      aws:cdk:path: GpuInferenceApi/Inference/GpuCapacity/GpuCapacityRole/Resource
  InferenceGpuCapacityInstanceRole316A67DC:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
        Version: "2012-10-17"
      Policies:
        - PolicyDocument:
            Statement:
              - Action: ecs:DiscoverPollEndpoint
                Effect: Allow
                Resource: "*"
                Sid: ECSAgentDiscoverPollEndpointPermissions
              - Action: ecs:RegisterContainerInstance
                Effect: Allow
                Resource:
                  Fn::GetAtt:
                    - InferenceCluster6D181EAC
                    - Arn
                Sid: ECSAgentRegisterPermissions
              - Action: ecs:Poll
                Effect: Allow
                Resource:
                  Fn::Join:
                    - ""
                    - - "arn:"
                      - Ref: AWS::Partition
                      - ":ecs:"
                      - Ref: AWS::Region
                      - ":"
                      - Ref: AWS::AccountId
                      - :container-instance/*
                Sid: ECSAgentPollPermissions
              - Action:
                  - ecs:StartTelemetrySession
                  - ecs:PutSystemLogEvents
                Effect: Allow
                Resource:
                  Fn::Join:
                    - ""
                    - - "arn:"
                      - Ref: AWS::Partition
                      - ":ecs:"
                      - Ref: AWS::Region
                      - ":"
                      - Ref: AWS::AccountId
                      - :container-instance/*
                Sid: ECSAgentTelemetryPermissions
              - Action:
                  - ecs:SubmitAttachmentStateChanges
                  - ecs:SubmitTaskStateChange
                Effect: Allow
                Resource:
                  Fn::GetAtt:
                    - InferenceCluster6D181EAC
                    - Arn
                Sid: ECSAgentStateChangePermissions
            Version: "2012-10-17"
          PolicyName: ECSInstancePolicy
      RoleName: ecsInstanceRoleGpuInferenceApiInferenceGpuCapacity201FA719
    Metadata:
      aws:cdk:path: GpuInferenceApi/Inference/GpuCapacity/InstanceRole/Resource
  InferenceGpuCapacityInstanceProfileB7C43D60:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: ecsInstanceRoleGpuInferenceApiInferenceGpuCapacity201FA719
      Roles:
        - Ref: InferenceGpuCapacityInstanceRole316A67DC
    Metadata:
      aws:cdk:path: GpuInferenceApi/Inference/GpuCapacity/InstanceProfile/Resource
  InferenceGpuCapacity88AB5A98:
