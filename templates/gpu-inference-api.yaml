      LoadBalancerArn:
        Ref: InferenceAlb8EDCDCD4
      Port: 80
      Protocol: HTTP
    Metadata:
      aws:cdk:path: GpuInferenceApi/Inference/Alb/AlbListener/Resource
  InferenceAlbTargets04311DB9:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckIntervalSeconds: 30
