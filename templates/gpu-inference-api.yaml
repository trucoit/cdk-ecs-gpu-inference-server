        Fn::GetAtt:
          - InferenceAlbSecurityGroup43AB8D63
          - GroupId
      IpProtocol: tcp
      ToPort: 8000
    Metadata:
      aws:cdk:path: GpuInferenceApi/Inference/Alb/SecurityGroup/to GpuInferenceApiInferenceTaskSecurityGroupA527F23D:8000
  InferenceAlbAlbListener52D2135F:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
