          Fn::GetAtt:
            - InferenceGpuCapacityGpuCapacityRole926629D2
            - Arn
        InstanceLaunchTemplate:
          CapacityOptionType: ON_DEMAND
          Ec2InstanceProfileArn:
            Fn::GetAtt:
              - InferenceGpuCapacityInstanceProfileB7C43D60
              - Arn
          InstanceRequirements:
            AcceleratorCount:
              Max: 1
              Min: 1
            AcceleratorManufacturers:
              - nvidia
            AcceleratorTotalMemoryMiB:
              Min: 16384
            AcceleratorTypes:
              - gpu
            MemoryMiB:
              Max: 65536
              Min: 16384
            VCpuCount:
              Max: 16
              Min: 4
          NetworkConfiguration:
            SecurityGroups:
              - Fn::GetAtt:
                  - InferenceInstanceSecurityGroup1503225E
                  - GroupId
            Subnets:
              - Ref: PrivateSubnetId1
              - Ref: PrivateSubnetId2
    Metadata:
      aws:cdk:path: GpuInferenceApi/Inference/GpuCapacity/GpuCapacity
  InferenceModelLogs79C0F310:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/gpu-inference/model
      RetentionInDays: 14
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
    Metadata:
      aws:cdk:path: GpuInferenceApi/Inference/ModelLogs/Resource
  InferenceTaskDefTaskRole1A8282F0:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
        Version: "2012-10-17"
    Metadata:
      aws:cdk:path: GpuInferenceApi/Inference/TaskDef/TaskRole/Resource
  InferenceTaskDefCA602E93:
    Type: AWS::ECS::TaskDefinition
    Properties:
      ContainerDefinitions:
        - Command:
            - --model
            - Ref: ModelId
            - --dtype
            - half
            - --max-model-len
            - "8192"
            - --gpu-memory-utilization
            - "0.9"
          Cpu: 2048
          Environment:
            - Name: VLLM_WORKER_MULTIPROC_METHOD
              Value: spawn
          Essential: true
          HealthCheck:
            Command:
              - CMD-SHELL
              - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" || exit 1
            Interval: 30
            Retries: 10
            StartPeriod: 300
            Timeout: 5
          Image:
            Ref: ModelImage
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Ref: InferenceModelLogs79C0F310
              awslogs-stream-prefix: model
              awslogs-region:
                Ref: AWS::Region
          Memory: 12288
          Name: model
          PortMappings:
            - ContainerPort: 8000
              Name: model
              Protocol: tcp
          ResourceRequirements:
            - Type: GPU
              Value: "1"
          Ulimits:
            - HardLimit: -1
              Name: memlock
              SoftLimit: -1
      ExecutionRoleArn:
        Fn::GetAtt:
          - InferenceTaskDefExecutionRole9F8D1C74
          - Arn
      Family: GpuInferenceApiInferenceTaskDef5E4F901A
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - MANAGED_INSTANCES
      TaskRoleArn:
        Fn::GetAtt:
          - InferenceTaskDefTaskRole1A8282F0
          - Arn
    Metadata:
      aws:cdk:path: GpuInferenceApi/Inference/TaskDef/Resource
  InferenceTaskDefExecutionRole9F8D1C74:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
        Version: "2012-10-17"
    Metadata:
      aws:cdk:path: GpuInferenceApi/Inference/TaskDef/ExecutionRole/Resource
  InferenceTaskDefExecutionRoleDefaultPolicy2656CC83:
    Type: AWS::IAM::Policy
    Properties:
      PolicyDocument:
        Statement:
          - Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Effect: Allow
            Resource:
              Fn::GetAtt:
                - InferenceModelLogs79C0F310
                - Arn
        Version: "2012-10-17"
      PolicyName: InferenceTaskDefExecutionRoleDefaultPolicy2656CC83
      Roles:
        - Ref: InferenceTaskDefExecutionRole9F8D1C74
    Metadata:
      aws:cdk:path: GpuInferenceApi/Inference/TaskDef/ExecutionRole/DefaultPolicy/Resource
  InferenceAlb8EDCDCD4:
