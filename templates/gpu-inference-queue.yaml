        - PolicyDocument:
            Statement:
              - Action: ecs:DiscoverPollEndpoint
                Effect: Allow
                Resource: "*"
                Sid: ECSAgentDiscoverPollEndpointPermissions
              - Action: ecs:RegisterContainerInstance
                Effect: Allow
                Resource:
                  Fn::GetAtt:
                    - InferenceCluster6D181EAC
                    - Arn
                Sid: ECSAgentRegisterPermissions
              - Action: ecs:Poll
                Effect: Allow
                Resource:
                  Fn::Join:
                    - ""
                    - - "arn:"
                      - Ref: AWS::Partition
                      - ":ecs:"
                      - Ref: AWS::Region
                      - ":"
                      - Ref: AWS::AccountId
                      - :container-instance/*
                Sid: ECSAgentPollPermissions
              - Action:
                  - ecs:StartTelemetrySession
                  - ecs:PutSystemLogEvents
                Effect: Allow
                Resource:
                  Fn::Join:
                    - ""
                    - - "arn:"
                      - Ref: AWS::Partition
                      - ":ecs:"
                      - Ref: AWS::Region
                      - ":"
                      - Ref: AWS::AccountId
                      - :container-instance/*
                Sid: ECSAgentTelemetryPermissions
              - Action:
                  - ecs:SubmitAttachmentStateChanges
                  - ecs:SubmitTaskStateChange
                Effect: Allow
                Resource:
                  Fn::GetAtt:
                    - InferenceCluster6D181EAC
                    - Arn
                Sid: ECSAgentStateChangePermissions
            Version: "2012-10-17"
          PolicyName: ECSInstancePolicy
      RoleName: ecsInstanceRoleGpuInferenceQueueInferenceGpuCapacity4FF63D96
    Metadata:
      aws:cdk:path: GpuInferenceQueue/Inference/GpuCapacity/InstanceRole/Resource
  InferenceGpuCapacityInstanceProfileB7C43D60:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: ecsInstanceRoleGpuInferenceQueueInferenceGpuCapacity4FF63D96
      Roles:
        - Ref: InferenceGpuCapacityInstanceRole316A67DC
    Metadata:
      aws:cdk:path: GpuInferenceQueue/Inference/GpuCapacity/InstanceProfile/Resource
  InferenceGpuCapacity88AB5A98:
    Type: AWS::ECS::CapacityProvider
    Properties:
      ClusterName:
        Ref: InferenceCluster6D181EAC
      ManagedInstancesProvider:
        InfrastructureRoleArn:
          Fn::GetAtt:
            - InferenceGpuCapacityGpuCapacityRole926629D2
            - Arn
        InstanceLaunchTemplate:
          CapacityOptionType: ON_DEMAND
          Ec2InstanceProfileArn:
            Fn::GetAtt:
              - InferenceGpuCapacityInstanceProfileB7C43D60
              - Arn
          InstanceRequirements:
            AcceleratorCount:
              Max: 1
              Min: 1
            AcceleratorManufacturers:
              - nvidia
            AcceleratorTotalMemoryMiB:
              Min: 16384
            AcceleratorTypes:
              - gpu
            MemoryMiB:
              Max: 65536
              Min: 16384
            VCpuCount:
              Max: 16
              Min: 4
          NetworkConfiguration:
            SecurityGroups:
              - Fn::GetAtt:
                  - InferenceInstanceSecurityGroup1503225E
                  - GroupId
            Subnets:
              - Ref: PrivateSubnetId1
              - Ref: PrivateSubnetId2
    Metadata:
      aws:cdk:path: GpuInferenceQueue/Inference/GpuCapacity/GpuCapacity
  InferenceModelLogs79C0F310:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/gpu-inference/model
      RetentionInDays: 14
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
    Metadata:
      aws:cdk:path: GpuInferenceQueue/Inference/ModelLogs/Resource
  InferenceTaskDefTaskRole1A8282F0:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
        Version: "2012-10-17"
    Metadata:
      aws:cdk:path: GpuInferenceQueue/Inference/TaskDef/TaskRole/Resource
  InferenceTaskDefTaskRoleDefaultPolicy14A0FEAA:
    Type: AWS::IAM::Policy
    Properties:
      PolicyDocument:
        Statement:
          - Action:
              - sqs:ReceiveMessage
              - sqs:ChangeMessageVisibility
              - sqs:GetQueueUrl
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
            Effect: Allow
            Resource:
              Fn::GetAtt:
                - InferenceJobQueueD05BC90C
                - Arn
          - Action:
              - sqs:SendMessage
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
            Effect: Allow
            Resource:
              Fn::GetAtt:
                - InferenceJobQueueDlq628A214C
                - Arn
          - Action:
              - s3:GetObject
              - s3:DeleteObject
            Effect: Allow
            Resource:
              Fn::Join:
                - ""
                - - "arn:"
                  - Ref: AWS::Partition
                  - ":s3:::"
                  - Ref: DataBucketName
                  - /async-input/*
          - Action: s3:PutObject
            Effect: Allow
            Resource:
              Fn::Join:
                - ""
                - - "arn:"
                  - Ref: AWS::Partition
                  - ":s3:::"
                  - Ref: DataBucketName
                  - /async-output/*
        Version: "2012-10-17"
      PolicyName: InferenceTaskDefTaskRoleDefaultPolicy14A0FEAA
      Roles:
        - Ref: InferenceTaskDefTaskRole1A8282F0
    Metadata:
      aws:cdk:path: GpuInferenceQueue/Inference/TaskDef/TaskRole/DefaultPolicy/Resource
  InferenceTaskDefCA602E93:
    Type: AWS::ECS::TaskDefinition
    Properties:
      ContainerDefinitions:
        - Command:
            - --model
            - Ref: ModelId
            - --dtype
            - half
            - --max-model-len
            - "8192"
            - --gpu-memory-utilization
            - "0.9"
          Cpu: 2048
          Environment:
            - Name: VLLM_WORKER_MULTIPROC_METHOD
              Value: spawn
          Essential: true
          HealthCheck:
            Command:
              - CMD-SHELL
              - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" || exit 1
            Interval: 30
            Retries: 10
            StartPeriod: 300
            Timeout: 5
          Image:
            Ref: ModelImage
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Ref: InferenceModelLogs79C0F310
              awslogs-stream-prefix: model
              awslogs-region:
                Ref: AWS::Region
          Memory: 12288
          Name: model
          PortMappings:
            - ContainerPort: 8000
              Name: model
              Protocol: tcp
          ResourceRequirements:
            - Type: GPU
              Value: "1"
          Ulimits:
            - HardLimit: -1
              Name: memlock
              SoftLimit: -1
        - Cpu: 512
          DependsOn:
            - Condition: HEALTHY
              ContainerName: model
          Environment:
            - Name: QUEUE_URL
              Value:
                Ref: InferenceJobQueueD05BC90C
            - Name: DLQ_URL
              Value:
                Ref: InferenceJobQueueDlq628A214C
            - Name: S3_BUCKET
              Value:
                Ref: DataBucketName
            - Name: AWS_DEFAULT_REGION
              Value:
                Ref: AWS::Region
            - Name: MODEL_ENDPOINT
              Value: http://localhost:8000
            - Name: HEALTH_ENDPOINT
              Value: http://localhost:8000/health
            - Name: INPUT_PREFIX
              Value: async-input/
            - Name: OUTPUT_PREFIX
              Value: async-output/
            - Name: REQUEST_STYLE
              Value: chat
            - Name: MODEL_ID
              Value:
                Ref: ModelId
          Essential: true
          Image:
            Ref: WorkerImage
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Ref: InferenceWorkerLogsB13603A9
              awslogs-stream-prefix: worker
              awslogs-region:
                Ref: AWS::Region
          Memory: 1024
          Name: worker
          StopTimeout: 120
      ExecutionRoleArn:
        Fn::GetAtt:
          - InferenceTaskDefExecutionRole9F8D1C74
          - Arn
      Family: GpuInferenceQueueInferenceTaskDefC1CF0AE5
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - MANAGED_INSTANCES
      TaskRoleArn:
        Fn::GetAtt:
          - InferenceTaskDefTaskRole1A8282F0
          - Arn
    Metadata:
      aws:cdk:path: GpuInferenceQueue/Inference/TaskDef/Resource
  InferenceTaskDefExecutionRole9F8D1C74:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
        Version: "2012-10-17"
    Metadata:
      aws:cdk:path: GpuInferenceQueue/Inference/TaskDef/ExecutionRole/Resource
  InferenceTaskDefExecutionRoleDefaultPolicy2656CC83:
    Type: AWS::IAM::Policy
    Properties:
      PolicyDocument:
        Statement:
          - Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Effect: Allow
            Resource:
              Fn::GetAtt:
                - InferenceModelLogs79C0F310
                - Arn
          - Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Effect: Allow
            Resource:
              Fn::GetAtt:
                - InferenceWorkerLogsB13603A9
                - Arn
        Version: "2012-10-17"
      PolicyName: InferenceTaskDefExecutionRoleDefaultPolicy2656CC83
      Roles:
        - Ref: InferenceTaskDefExecutionRole9F8D1C74
    Metadata:
      aws:cdk:path: GpuInferenceQueue/Inference/TaskDef/ExecutionRole/DefaultPolicy/Resource
  InferenceJobQueueDlq628A214C:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
    Metadata:
      aws:cdk:path: GpuInferenceQueue/Inference/JobQueueDlq/Resource
  InferenceJobQueueDlqPolicy7FFE642C:
    Type: AWS::SQS::QueuePolicy
    Properties:
      PolicyDocument:
        Statement:
          - Action: sqs:*
            Condition:
              Bool:
                aws:SecureTransport: "false"
            Effect: Deny
            Principal:
              AWS: "*"
            Resource:
              Fn::GetAtt:
                - InferenceJobQueueDlq628A214C
                - Arn
        Version: "2012-10-17"
      Queues:
        - Ref: InferenceJobQueueDlq628A214C
    Metadata:
      aws:cdk:path: GpuInferenceQueue/Inference/JobQueueDlq/Policy/Resource
  InferenceJobQueueD05BC90C:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 86400
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
            - InferenceJobQueueDlq628A214C
            - Arn
        maxReceiveCount: 5
      VisibilityTimeout: 1200
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
    Metadata:
      aws:cdk:path: GpuInferenceQueue/Inference/JobQueue/Resource
  InferenceJobQueuePolicyAC6EE0A2:
    Type: AWS::SQS::QueuePolicy
    Properties:
      PolicyDocument:
        Statement:
          - Action: sqs:*
            Condition:
              Bool:
                aws:SecureTransport: "false"
            Effect: Deny
            Principal:
              AWS: "*"
            Resource:
              Fn::GetAtt:
                - InferenceJobQueueD05BC90C
                - Arn
        Version: "2012-10-17"
      Queues:
        - Ref: InferenceJobQueueD05BC90C
    Metadata:
      aws:cdk:path: GpuInferenceQueue/Inference/JobQueue/Policy/Resource
  InferenceWorkerLogsB13603A9:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/gpu-inference/worker
      RetentionInDays: 14
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Metadata:
      aws:cdk:path: GpuInferenceQueue/Inference/WorkerLogs/Resource
