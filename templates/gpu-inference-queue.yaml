    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions:
        - Ref: InferenceScalingScaleOut054BBD86
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: QueueName
          Value:
            Fn::GetAtt:
              - InferenceJobQueueD05BC90C
              - QueueName
      EvaluationPeriods: 1
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Period: 60
      Statistic: Maximum
      Threshold: 1
      TreatMissingData: notBreaching
    Metadata:
