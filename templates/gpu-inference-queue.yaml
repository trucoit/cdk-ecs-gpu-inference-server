                - InferenceServiceCF6639DD
                - Name
      RoleARN:
        Fn::GetAtt:
          - InferenceScalingTargetRoleFA0BC3CE
          - Arn
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
    DependsOn:
      - InferenceServiceCF6639DD
    Metadata:
      aws:cdk:path: GpuInferenceQueue/Inference/ScalingTarget/Resource
  InferenceScalingScaleOut054BBD86:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: GpuInferenceQueueInferenceScalingScaleOut35A593EE
      PolicyType: StepScaling
      ScalingTargetId:
        Ref: InferenceScalingTarget1E97258C
      StepScalingPolicyConfiguration:
        AdjustmentType: ExactCapacity
        Cooldown: 600
