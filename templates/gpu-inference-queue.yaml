Description: "GPU inference (queue mode): SQS-driven, scale-to-zero ECS Managed Instances service."
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to deploy into.
  PrivateSubnetId1:
    Type: AWS::EC2::Subnet::Id
    Description: First private subnet (needs egress to pull images and reach AWS APIs).
  PrivateSubnetId2:
    Type: AWS::EC2::Subnet::Id
    Description: Second private subnet (different AZ).
  DataBucketName:
    Type: String
    Description: Existing S3 bucket for job input (async-input/) and output (async-output/).
  ModelId:
    Type: String
    Default: Qwen/Qwen2.5-1.5B-Instruct
    Description: Model the vLLM server loads and the worker requests.
  ModelImage:
    Type: String
    Default: vllm/vllm-openai:v0.6.6
    Description: OpenAI-compatible model server image.
  WorkerImage:
    Type: String
    Description: SQS worker image URI (an OpenAI-protocol poller). Build and push it, then set it here.
Resources:
  InferenceTaskSecurityGroup3C4FE9ED:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: GPU inference task ENIs
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: HTTPS egress to AWS endpoints and image registries
          FromPort: 443
          IpProtocol: tcp
          ToPort: 443
      VpcId:
        Ref: VpcId
    Metadata:
      aws:cdk:path: GpuInferenceQueue/Inference/TaskSecurityGroup/Resource
  InferenceCluster6D181EAC:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings:
        - Name: containerInsights
          Value: enhanced
    Metadata:
      aws:cdk:path: GpuInferenceQueue/Inference/Cluster/Resource
  InferenceInstanceSecurityGroup1503225E:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: GPU inference instances
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: HTTPS egress to AWS endpoints and image registries
          FromPort: 443
          IpProtocol: tcp
          ToPort: 443
      VpcId:
        Ref: VpcId
    Metadata:
      aws:cdk:path: GpuInferenceQueue/Inference/InstanceSecurityGroup/Resource
  InferenceGpuCapacityGpuCapacityRole926629D2:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: ecs.amazonaws.com
        Version: "2012-10-17"
      ManagedPolicyArns:
        - Fn::Join:
            - ""
            - - "arn:"
              - Ref: AWS::Partition
              - :iam::aws:policy/AmazonECSInfrastructureRolePolicyForManagedInstances
    Metadata:
      aws:cdk:path: GpuInferenceQueue/Inference/GpuCapacity/GpuCapacityRole/Resource
  InferenceGpuCapacityInstanceRole316A67DC:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
        Version: "2012-10-17"
