name: build

on:
  push:
    branches: [main, dev]
    paths:
      - 'cdk/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'cdk/**'
      - '.github/workflows/build.yml'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cdk/package-lock.json
      # `make test` installs, lints, and runs jest (unit assertions + cdk-nag).
      - run: make test
      # Compile the distributable declarations so a broken build fails CI too.
      - run: make build
