name: build

on:
  # Allow running the workflow manually from the Actions tab.
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths:
      - 'cdk/**'
      - 'sample/**'
      - 'templates/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'cdk/**'
      - 'sample/**'
      - 'templates/**'
      - '.github/workflows/build.yml'

# Needed so the push job can commit the regenerated templates back.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            cdk/package-lock.json
            sample/package-lock.json

      # Library: install, lint, jest (unit assertions + cdk-nag), then compile.
      - run: make test
        working-directory: cdk
      - run: make build
        working-directory: cdk
      # Regenerate the standalone, parameterized CFN templates (queue + api).
      - run: make template
        working-directory: cdk

      # On push, commit the regenerated templates back if they changed.
      - name: Commit regenerated templates
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain templates)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add templates
            git commit -m 'chore: regenerate example templates from CDK app [skip ci]'
            git push
          else
            echo "Templates already up to date."
          fi
